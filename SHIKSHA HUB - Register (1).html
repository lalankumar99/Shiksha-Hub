<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIKSHA HUB - Create Account</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(255, 255, 255, 0.02);
            --gold-light: #fef08a;
            --gold-main: #eab308;
            --gold-dark: #ca8a04;
            --royal-blue: #1d4ed8;
            --royal-blue-light: #3b82f6;
            --error-red: #ef4444;
            --success-green: #10b981;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Better for long forms on mobile */
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Ambient Backgrounds --- */
        .ambient-glow-blue {
            position: fixed; width: 80vw; height: 80vw; max-width: 600px; max-height: 600px;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, transparent 60%);
            top: -10%; left: -10%; border-radius: 50%; filter: blur(70px);
            z-index: 0; animation: pulse 8s ease-in-out infinite alternate;
        }
        
        .ambient-glow-gold {
            position: fixed; width: 60vw; height: 60vw; max-width: 500px; max-height: 500px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.1) 0%, transparent 70%);
            bottom: -10%; right: -10%; border-radius: 50%; filter: blur(60px);
            z-index: 0; animation: pulse 10s ease-in-out infinite alternate-reverse;
        }

        /* --- Main Container --- */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-glow {
            width: 70px; height: 70px;
            border-radius: 16px;
            filter: drop-shadow(0 0 12px rgba(234, 179, 8, 0.3));
            animation: softGlow 3s infinite alternate;
        }

        /* --- Section Headers --- */
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-main);
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); margin-left: 10px;
        }

        /* --- Form Inputs --- */
        .input-group { position: relative; margin-bottom: 1.2rem; }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.4); transition: color 0.3s ease; pointer-events: none;}
        
        .premium-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 16px 14px 48px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .premium-input:focus {
            border-color: var(--gold-main);
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }
        .premium-input:focus + .input-icon { color: var(--gold-main); }

        /* --- Interactive Selection (Class & Board) --- */
        .selection-grid { display: grid; gap: 10px; margin-bottom: 1rem; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr; }
        @media (min-width: 400px) { .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }

        .select-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        }
        
        .select-btn:hover { background: rgba(255,255,255,0.05); }
        .select-btn.active {
            background: rgba(234, 179, 8, 0.15);
            border-color: var(--gold-main);
            color: var(--gold-main);
            box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.1);
        }
        .btn-subtitle { font-size: 0.7rem; opacity: 0.7; font-weight: 500; }

        /* --- Smart Level Badge --- */
        .level-badge-container {
            background: rgba(29, 78, 216, 0.1);
            border: 1px solid rgba(29, 78, 216, 0.3);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 1.5rem;
            display: none; /* Hidden until class is selected */
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.3s ease;
        }
        .level-label { font-size: 0.85rem; color: rgba(255,255,255,0.7); }
        .level-value { font-size: 0.95rem; font-weight: 700; color: var(--gold-main); letter-spacing: 1px;}

        /* --- Buttons --- */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: var(--bg-dark);
            font-weight: 800;
            font-size: 1.05rem;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.25);
            display: flex; justify-content: center; align-items: center;
            margin-top: 1rem;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-outline {
            display: block; width: 100%; text-align: center;
            padding: 14px; border-radius: 12px;
            border: 1px solid var(--gold-main);
            color: var(--gold-main); font-weight: 600; font-size: 0.95rem;
            text-decoration: none; margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-outline:active { background: rgba(234, 179, 8, 0.1); }

        /* --- Utilities --- */
        .message-box {
            display: none; padding: 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 500;
            margin-bottom: 1.5rem; text-align: center; animation: fadeIn 0.3s ease;
        }
        .msg-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--error-red); }
        .msg-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success-green); }

        .spinner {
            display: none; width: 22px; height: 22px;
            border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid var(--bg-dark);
            border-radius: 50%; animation: spin 1s linear infinite;
        }

        .eye-btn {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: rgba(255, 255, 255, 0.4);
            cursor: pointer; padding: 4px; display: flex;
        }

        /* Animations */
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }
        @keyframes softGlow { 0% { filter: drop-shadow(0 0 10px rgba(234, 179, 8, 0.2)); } 100% { filter: drop-shadow(0 0 25px rgba(234, 179, 8, 0.6)); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .title-gradient { background: linear-gradient(to right, #ffffff, #e0e0e0, var(--gold-light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
</head>
<body>

    <!-- Ambient Glows -->
    <div class="ambient-glow-blue"></div>
    <div class="ambient-glow-gold"></div>

    <!-- Registration Card -->
    <div class="glass-card">
        
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-glow" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjZWFiMzA4Ii8+PHRleHQgeD0iNTAiIHk9IjU4IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMzUiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSIjMDMwNzEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5TSDwvdGV4dD48L3N2Zz4='">
        </div>

        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold title-gradient mb-1">Create Account</h1>
            <p class="text-sm text-gray-400">Join the premium learning platform</p>
        </div>

        <!-- System Alerts -->
        <div id="alertBox" class="message-box"></div>

        <form id="registerForm" novalidate>
            
            <!-- SECTION: Personal Details -->
            <div class="section-title">Personal Details</div>
            
            <div class="input-group">
                <input type="text" id="fullName" class="premium-input" placeholder="Enter your full name" required autocomplete="name">
                <svg class="input-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>

            <div class="input-group">
                <input type="email" id="email" class="premium-input" placeholder="Enter your email address" required autocomplete="email">
                <svg class="input-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>

            <div class="input-group">
                <input type="tel" id="mobile" class="premium-input" placeholder="Enter your mobile number" required pattern="[0-9]{10}">
                <svg class="input-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            </div>

            <!-- SECTION: Academic Profile -->
            <div class="section-title">Academic Profile</div>
            
            <label class="block text-xs font-semibold text-gray-400 mb-2 ml-1">SELECT CLASS</label>
            <div class="selection-grid grid-2">
                <div class="select-btn class-btn" data-class="9th">
                    <span>Class 9th</span>
                    <span class="btn-subtitle text-blue-400">MATRIC</span>
                </div>
                <div class="select-btn class-btn" data-class="10th">
                    <span>Class 10th</span>
                    <span class="btn-subtitle text-blue-400">MATRIC</span>
                </div>
                <div class="select-btn class-btn" data-class="11th">
                    <span>Class 11th</span>
                    <span class="btn-subtitle text-purple-400">INTER</span>
                </div>
                <div class="select-btn class-btn" data-class="12th">
                    <span>Class 12th</span>
                    <span class="btn-subtitle text-purple-400">INTER</span>
                </div>
            </div>

            <!-- Smart Auto-calculated Level Indicator -->
            <div id="levelBadgeContainer" class="level-badge-container">
                <span class="level-label">Assigned Level</span>
                <span class="level-value" id="levelValueDisplay">--</span>
            </div>

            <label class="block text-xs font-semibold text-gray-400 mb-2 ml-1 mt-4">SELECT BOARD</label>
            <div class="selection-grid grid-3">
                <div class="select-btn board-btn" data-board="Bihar Board">Bihar<br>Board</div>
                <div class="select-btn board-btn" data-board="CBSE">CBSE</div>
                <div class="select-btn board-btn" data-board="UP Board">UP<br>Board</div>
            </div>

            <!-- SECTION: Security -->
            <div class="section-title mt-6">Account Security</div>
            
            <div class="input-group">
                <input type="password" id="password" class="premium-input" placeholder="Create your password" required>
                <svg class="input-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <button type="button" class="eye-btn" onclick="toggleVis('password', 'eye1')">
                    <svg id="eye1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>

            <div class="input-group">
                <input type="password" id="confirmPassword" class="premium-input" placeholder="Confirm your password" required>
                <svg class="input-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <button type="button" class="eye-btn" onclick="toggleVis('confirmPassword', 'eye2')">
                    <svg id="eye2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="registerBtn" class="btn-primary">
                <span id="btnText">CREATE ACCOUNT</span>
                <div id="btnSpinner" class="spinner ml-2"></div>
            </button>
            
            <!-- Login Redirect Container (Hidden by default, shown on duplicate email) -->
            <div id="loginRedirectWrapper" style="display: none;">
                <button type="button" onclick="window.location.href='login.html'" class="btn-outline">
                    GO TO LOGIN
                </button>
            </div>
            
            <div class="mt-6 text-center text-sm text-gray-400">
                Already have an account? <a href="login.html" class="text-gold-main font-semibold hover:underline">Log In</a>
            </div>
        </form>

    </div>

    <!-- Application Logic (Firebase & UI) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDmZ4bKHE_siwDC5LGcobdxGeDSnVfiuHY",
            authDomain: "bseb-b12ba.firebaseapp.com",
            projectId: "bseb-b12ba",
            storageBucket: "bseb-b12ba.firebasestorage.app",
            messagingSenderId: "379716858804",
            appId: "1:379716858804:web:e92eebd6843553084af8e1",
            measurementId: "G-X49FDGMSN6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Variables for Architecture
        let selectedClass = "";
        let autoCalculatedLevel = "";
        let selectedBoard = "";

        // UI Elements
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('registerBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const loginRedirectWrapper = document.getElementById('loginRedirectWrapper');
        
        // UI Helpers
        function showMessage(msg, type) {
            alertBox.innerHTML = msg;
            alertBox.className = `message-box ${type === 'error' ? 'msg-error' : 'msg-success'}`;
            alertBox.style.display = 'block';
            
            // Scroll to message if it's off-screen on mobile
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function hideMessage() {
            alertBox.style.display = 'none';
            loginRedirectWrapper.style.display = 'none';
        }

        // --- NEW: Dynamic Routing Function ---
        function getDashboardPath(board, level) {
            const boardFolder = {
                "Bihar Board": "bihar",
                "CBSE": "cbse",
                "UP Board": "up"
            }[board];

            if (!boardFolder) {
                throw new Error("Invalid board selected.");
            }

            if (level !== "matric" && level !== "inter") {
                throw new Error("Invalid education level.");
            }

            return `${boardFolder}/${level}/home.html`;
        }

        // --- Selection Logic: Class & Smart Level ---
        const classBtns = document.querySelectorAll('.class-btn');
        const levelBadgeContainer = document.getElementById('levelBadgeContainer');
        const levelValueDisplay = document.getElementById('levelValueDisplay');

        classBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // UI Toggle
                classBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // State Update
                selectedClass = btn.dataset.class;
                
                // Core Architecture Rule: Calculate Level automatically
                if (selectedClass === "9th" || selectedClass === "10th") {
                    autoCalculatedLevel = "matric";
                    levelValueDisplay.textContent = "MATRIC";
                } else if (selectedClass === "11th" || selectedClass === "12th") {
                    autoCalculatedLevel = "inter";
                    levelValueDisplay.textContent = "INTER";
                }

                // Show the smart badge
                levelBadgeContainer.style.display = 'flex';
                hideMessage();
            });
        });

        // --- Selection Logic: Board ---
        const boardBtns = document.querySelectorAll('.board-btn');
        boardBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                boardBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedBoard = btn.dataset.board;
                hideMessage();
            });
        });

        // --- Password Visibility Toggle ---
        window.toggleVis = function(inputId, iconId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            // Visual feedback on icon (optional opacity change)
            document.getElementById(iconId).style.opacity = type === 'text' ? '1' : '0.6';
        }

        // --- Form Submission & Validation ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            // 1. Gather Inputs
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 2. Validate Fields
            if (!fullName) return showMessage("Please enter your full name.", "error");
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) return showMessage("Please enter a valid email address.", "error");
            
            const mobileRegex = /^[6-9]\d{9}$/;
            if (!mobileRegex.test(mobile)) return showMessage("Please enter a valid 10-digit mobile number.", "error");
            
            if (!selectedClass || !autoCalculatedLevel) return showMessage("Please select your Class.", "error");
            if (!selectedBoard) return showMessage("Please select your Board.", "error");
            
            if (password.length < 6) return showMessage("Password must be at least 6 characters long.", "error");
            if (password !== confirmPassword) return showMessage("Passwords do not match.", "error");

            // 3. Pre-calculate Dashboard Path to ensure validity before creating account
            let dashboardPath = "";
            try {
                dashboardPath = getDashboardPath(selectedBoard, autoCalculatedLevel);
            } catch (err) {
                return showMessage("Unable to determine your dashboard. Please select your Class and Board again.", "error");
            }

            // 4. UI Loading State
            submitBtn.disabled = true;
            btnText.textContent = "CREATING ACCOUNT...";
            btnSpinner.style.display = "block";

            try {
                // 5. Create Firebase Auth Account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 6. Build Profile Object (Architecture adherence)
                const userProfile = {
                    uid: user.uid, // Using UID as identifier
                    name: fullName,
                    email: email,
                    mobile: mobile,
                    level: autoCalculatedLevel, // Extracted automatically: matric/inter
                    class: selectedClass,       // Original input: 9th/10th/11th/12th
                    board: selectedBoard,       // Original input: Bihar Board/CBSE/UP Board
                    role: "student",
                    createdAt: serverTimestamp()
                };

                // 7. Save Profile to Firestore
                // Path: users/{uid}
                const userDocRef = doc(db, "users", user.uid);
                await setDoc(userDocRef, userProfile);

                // 8. Success State
                showMessage("Account Created Successfully! Redirecting...", "success");
                btnText.textContent = "SUCCESS!";
                btnSpinner.style.display = "none";

                // 9. Execute Dynamic Redirect 
                // Only triggers if Firebase Auth + Firestore successfully process
                setTimeout(() => {
                    window.location.replace(dashboardPath);
                }, 1000);

            } catch (error) {
                console.error("Registration Error:", error);
                
                // Reset UI
                submitBtn.disabled = false;
                btnText.textContent = "CREATE ACCOUNT";
                btnSpinner.style.display = "none";

                // Handle Specific Errors (e.g., Email already exists)
                if (error.code === 'auth/email-already-in-use') {
                    showMessage(`This email is already registered. Please login.`, "error");
                    loginRedirectWrapper.style.display = "block"; // Show login button
                } else if (error.code === 'auth/invalid-email') {
                    showMessage("The email address is improperly formatted.", "error");
                } else if (error.code === 'auth/weak-password') {
                    showMessage("The password is too weak. Please use a stronger password.", "error");
                } else if (error.code === 'auth/network-request-failed') {
                    showMessage("Network error. Please check your internet connection.", "error");
                } else {
                    showMessage("An error occurred during registration. Please try again.", "error");
                }
            }
        });
    </script>
</body>
</html>
